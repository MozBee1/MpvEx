name: Debug Build (installable APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APKs
        run: ./gradlew assembleStandardDebug

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug
          path: app/build/outputs/apk/standard/debug/app-standard-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-debug
          path: app/build/outputs/apk/standard/debug/app-standard-armeabi-v7a-debug.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-debug
          path: app/build/outputs/apk/standard/debug/app-standard-universal-debug.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-x86-debug
          path: app/build/outputs/apk/standard/debug/app-standard-x86-debug.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-debug
          path: app/build/outputs/apk/standard/debug/app-standard-x86_64-debug.apk
          if-no-files-found: error
